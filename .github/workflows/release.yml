name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (Static musl binary)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-musl-x86_64
            archive_type: tar

          # Linux ARM64 (glibc)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            archive_type: tar

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            archive_type: tar

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            archive_type: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies (musl x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Linux cross-compilers (ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

      # Package Linux & macOS (tar.gz)
      - name: Package Unix archive and checksum
        if: matrix.archive_type == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          BIN_SRC="target/${{ matrix.target }}/release/envseal"
          ARCHIVE="envseal-${{ matrix.name }}.tar.gz"

          cp "$BIN_SRC" envseal
          tar -czvf "$ARCHIVE" envseal

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

      # Package Windows (zip)
      - name: Package Windows archive and checksum
        if: matrix.archive_type == 'zip'
        shell: pwsh
        run: |
          $binSrc = "target/${{ matrix.target }}/release/envseal.exe"
          $archive = "envseal-${{ matrix.name }}.zip"
          Compress-Archive -Path $binSrc -DestinationPath $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "${archive}.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: envseal-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-winget:
    name: Publish to Winget
    needs: release
    runs-on: windows-latest
    steps:
      - name: Strip 'v' prefix from tag for winget version
        id: winget_version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Submit to Windows Package Manager
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: viswajith275.envseal
          version: ${{ steps.winget_version.outputs.version }}
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
