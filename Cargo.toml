[package]
name = "envseal"
version = "6.2.0"
edition = "2021"

[dependencies]
# CLI and parsing
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
directories = "6.0.0"
anyhow = "1"
base64 = "0.22.1"
fs2 = "0.4.3"
zstd = "0.13.3"
keyring = "4.1.6"

# Cryptography and security
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc", "getrandom"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "rand_core"] }
hkdf = "0.13.0"
sha2 = { version = "0.11.0", default-features = false }
zeroize = { version = "1", features = ["zeroize_derive", "serde"] }
rand = "0.8"
tempfile = "3"
hex = "0.4.3"
toml = "1.1.5"
age = { version = "0.12.1", features = ["armor", "cli-common", "ssh"] }

[dev-dependencies]
serial_test = "3"
assert_cmd = "2.0"
predicates = "3.1"

# Production Release Profile (optimized for binary footprint)
[profile.release]
opt-level = "z"          # Optimize strictly for size
lto = "fat"              # Full cross-crate link-time optimization
codegen-units = 1        # Single codegen unit for maximum dead-code elimination
panic = "abort"          # Strip landing pads and unwinding tables
strip = true             # Strip all symbols and debuginfo directly
